<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Madina Mobile Shop Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #080a0f;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .bg-grid {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(192,57,43,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192,57,43,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .bg-glow {
            position: absolute;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(192,57,43,0.08) 0%, transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        .login-card {
            position: relative; z-index: 1;
            background: #13161e;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 20px;
            padding: 48px 44px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 40px 120px rgba(0,0,0,0.6);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
        }

        .brand-sub {
            font-size: 10px;
            letter-spacing: 5px;
            color: #c0392b;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            background: rgba(192,57,43,0.1);
            border: 1px solid rgba(192,57,43,0.2);
            color: #c0392b;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 5px 14px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .login-subtitle {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9ca3af;
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
            font-size: 14px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #e8eaf0;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(192,57,43,0.5);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
        }

        .form-input::placeholder { color: #374151; }

        .toggle-pw {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            color: #4b5563; font-size: 14px;
            cursor: pointer; background: none; border: none;
            transition: color 0.2s;
        }
        .toggle-pw:hover { color: #c0392b; }

        .error-box {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #ef4444;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #c0392b, #a5281c);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(192,57,43,0.35);
        }

        .login-btn:active { transform: translateY(0); }

        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 11px;
            color: #374151;
        }

        .login-footer a { color: #6b7280; }
        .login-footer a:hover { color: #c0392b; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="login-card">
        <div class="login-brand" style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:30px;">
            <div style="display:inline-flex; align-items:center; gap:10px; justify-content:center; width:100%;">
                <img src="/static/images/madina_mark.png" alt="Madina Mobile Shop" style="height:38px; width:auto; display:block;">
                <div style="display:flex; flex-direction:column; justify-content:center; text-align:left; line-height:1.1;">
                    <span style="font-family:'Montserrat',sans-serif; font-weight:800; font-size:18px; letter-spacing:1.5px; color:#ffffff; text-transform:uppercase;">Madina</span>
                    <span style="font-family:'Montserrat',sans-serif; font-weight:500; font-size:9px; letter-spacing:2px; color:#e74c3c; text-transform:uppercase; margin-top:2px;">Mobile Shop</span>
                </div>
            </div>
            <div class="admin-badge"><i class="fas fa-shield-alt"></i> Admin Portal</div>
        </div>

        <div class="login-title">Welcome Back</div>
        <div class="login-subtitle">Sign in to manage your store</div>

        {% if error %}
        <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'admin_login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <div class="input-wrap">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> Sign In to Portal
            </button>
        </form>

        <div class="login-footer">
            &copy; 2026 Madina Mobile Shop &mdash; <a href="/" target="_blank">View Store</a>
        </div>
    </div>

    <script>
        document.getElementById('togglePw').addEventListener('click', function() {
            const inp = document.getElementById('id_password');
            const icon = this.querySelector('i');
            if (inp.type === 'password') {
                inp.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                inp.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });
    </script>
</body>
</html>
